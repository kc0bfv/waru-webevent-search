<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ block "title" . }}{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}{{ end }}</title>
  <meta name="description" content="{{ block "description" . }}{{ with .Params.description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}{{ end }}">
  {{ with .Params.thumbnail_url }}
  <meta property="og:image" content="{{ . }}">
  {{ end }}
  <link rel="stylesheet" href="/pagefind/pagefind-component-ui.css">
  <link rel="stylesheet" href="{{ "css/main.css" | absURL }}">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="site-logo" href="{{ "/" | relURL }}">WarU Search</a>
      {{ if not .IsHome }}
      <div class="nav-search">
        <pagefind-input label="" placeholder="Search transcripts…"></pagefind-input>
        <pagefind-results></pagefind-results>
      </div>
      {{ end }}
      <nav class="site-nav">
        <a href="{{ "/" | relURL }}">Home</a>
        <a href="{{ "/events/" | relURL }}">All Events</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="site-footer">
    <p>WarU Web Event Transcript Search</p>
    <p class="footer-links">
      <a href="https://github.com/kc0bfv/waru-webevent-search" target="_blank" rel="noopener">Source on GitHub</a>
      &middot;
      <a href="/llms.txt">llms.txt</a>
    </p>
  </footer>

  <script src="/pagefind/pagefind-component-ui.js" type="text/javascript"></script>
  {{ block "scripts" . }}{{ end }}
</body>
</html>
