{{ define "main" }}
<div class="events-index">
  <h1>{{ .Title }}</h1>
  <p class="event-count">{{ len .Pages }} events indexed</p>
  <ul class="events-list">
    {{ range .Pages.ByDate.Reverse }}
    <li class="event-item">
      <a class="event-link" href="{{ .RelPermalink }}">{{ .Title }}</a>
      <time class="event-date" datetime="{{ .Date.Format "2006-01-02" }}">
        {{ .Date.Format "Jan 2, 2006" }}
      </time>
    </li>
    {{ end }}
  </ul>
</div>
{{ end }}
