<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ block "title" . }}{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}{{ end }}</title>
  <meta name="description" content="{{ block "description" . }}{{ with .Params.description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}{{ end }}">
  {{ with .Params.thumbnail_url }}
  <meta property="og:image" content="{{ . }}">
  {{ end }}
  <link rel="stylesheet" href="https://kc0bfv.github.io/waru-webevent-search/css/main.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
    </div>
  </header>

  <main class="site-main">
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="site-footer">
    <p>WarU Web Event Transcript Search</p>
    <p class="footer-links">
      <a href="https://github.com/kc0bfv/waru-webevent-search" target="_blank" rel="noopener">Source on GitHub</a>
      &middot;
      <a href="https://kc0bfv.github.io/waru-webevent-search/llms.txt">llms.txt</a>
    </p>
  </footer>
  {{ block "scripts" . }}{{ end }}
</body>
</html>
